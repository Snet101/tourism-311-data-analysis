name: tourism-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: python -m pip check
      - run: python -m ruff check tourism_pipeline.py scripts tests
      - run: python -m pytest -q
      - run: python tourism_pipeline.py --config tests/fixtures/config.json --out runs/fixture
      - run: python scripts/keyword_sensitivity.py --config tests/fixtures/config.json --out runs/keyword-sensitivity
      - run: python scripts/check_notebooks.py --run runs/fixture
      - run: python scripts/plot_run.py --run runs/fixture --out runs/fixture-plots
